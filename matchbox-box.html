<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Matchbox Box</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #ffffff; color: #1a1a1a; font-family: 'Inter', 'Segoe UI', sans-serif; font-size: 13px; }

  #loading-state, #empty-state, #error-state {
    text-align: center; padding: 60px 20px; color: #9ca3af;
  }
  #loading-state .icon { font-size: 40px; margin-bottom: 12px; animation: spin 1.2s linear infinite; display: inline-block; }
  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  #empty-state .icon, #error-state .icon { font-size: 40px; margin-bottom: 12px; }
  #empty-state h2, #error-state h2 { font-size: 16px; font-weight: 600; color: #374151; margin-bottom: 6px; }

  #grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    padding: 16px;
  }
  @media (max-width: 600px) {
    #grid {
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      padding: 10px;
    }
  }

  .card {
    background: #ffffff; border: 1px solid #e5e7eb;
    border-radius: 10px; overflow: hidden;
    display: flex; flex-direction: column;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    transition: box-shadow 0.15s, transform 0.15s;
  }
  .card:hover { box-shadow: 0 6px 20px rgba(0,0,0,0.12); transform: translateY(-3px); }

  .card-img-wrap {
    width: 100%; aspect-ratio: 1; overflow: hidden;
    background: #f3f4f6; position: relative; cursor: pointer;
  }
  .card-img {
    width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0s;
  }
  .card-img-wrap:hover .card-img { transition: transform 1.5s ease; transform: scale(1.18); }
  .card-img-fallback {
    width: 100%; height: 100%; display: none;
    align-items: center; justify-content: center; font-size: 36px; background: #f3f4f6;
  }

  .card-body {
    padding: 8px 10px 10px; display: flex; flex-direction: column; flex: 1; gap: 3px; text-align: center;
  }
  .card-code-name { font-size: 11px; font-weight: 700; color: #111827; line-height: 1.3; }
  .card-code-name span.code { color: #6b7280; font-weight: 600; }
  .card-brand { font-size: 10px; color: #9ca3af; }
  .card-price { font-size: 14px; font-weight: 700; color: #111827; margin-top: 4px; }

  .add-btn {
    margin-top: 8px; background: #111827; color: #ffffff; border: none;
    border-radius: 6px; padding: 8px 6px; font-size: 11px; font-weight: 600;
    cursor: pointer; width: 100%; transition: background 0.15s; letter-spacing: 0.3px;
  }
  .add-btn:hover { background: #374151; }
  .add-btn:disabled { background: #d1fae5; color: #065f46; cursor: not-allowed; font-weight: 700; }

  #toast {
    position: fixed; bottom: 20px; left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: #111827; color: #fff; padding: 10px 18px; border-radius: 8px;
    font-size: 13px; font-weight: 500; transition: transform 0.3s ease; z-index: 999;
    white-space: nowrap; max-width: 90vw; box-shadow: 0 4px 16px rgba(0,0,0,0.18);
  }
  #toast.show { transform: translateX(-50%) translateY(0); }

  #pagination {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 16px;
    flex-wrap: wrap;
  }
  .page-btn {
    background: #ffffff;
    border: 1px solid #e5e7eb;
    color: #111827;
    border-radius: 6px;
    padding: 7px 12px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
    white-space: nowrap;
  }
  .page-btn:hover:not(:disabled) { background: #f3f4f6; border-color: #111827; }
  .page-btn:disabled { color: #d1d5db; border-color: #f3f4f6; cursor: not-allowed; }
  .page-info {
    font-size: 12px;
    font-weight: 600;
    color: #6b7280;
    padding: 7px 10px;
    white-space: nowrap;
  }
  .sold-btn {
    background: #dc2626 !important;
    color: #ffffff !important;
    cursor: not-allowed !important;
    opacity: 0.85;
  }
  .sold-btn:hover { background: #dc2626 !important; opacity: 0.85; }
  .hidden { display: none !important; }

  /* ── Availability filter (All / In Stock / Sold Out) ── */
  .avail-wrap { display: flex; justify-content: center; padding: 14px 10px 0; }
  .avail-pill {
    display: inline-flex; max-width: 100%; background: #f3f4f6;
    border-radius: 999px; padding: 4px; gap: 2px;
    box-shadow: inset 0 0 0 1px #e5e7eb;
  }
  .avail-opt {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    border: none; background: transparent; color: #111827;
    font-family: inherit; font-size: 13px; font-weight: 700;
    padding: 9px 20px; border-radius: 999px; cursor: pointer; white-space: nowrap;
    transition: background 0.15s, color 0.15s;
  }
  .avail-opt:hover:not(.active) { background: #e5e7eb; }
  .avail-opt:focus-visible { outline: 2px solid #111827; outline-offset: 2px; }
  .avail-opt.active { background: #111827; color: #ffffff; }
  .avail-count {
    background: #e5e7eb; color: #111827; font-size: 11px; font-weight: 700;
    min-width: 24px; padding: 2px 8px; border-radius: 999px; text-align: center;
  }
  .avail-opt.active .avail-count { background: #ffffff; color: #111827; }
  @media (max-width: 600px) {
    .avail-wrap { padding: 12px 10px 0; }
    .avail-pill { width: 100%; }
    .avail-opt {
      flex: 1 1 0; flex-direction: column; gap: 3px;
      padding: 7px 4px; min-height: 46px; font-size: 12px;
    }
  }

  /* ── Empty state for the availability filter ── */
  #empty-state { text-align: center; padding: 44px 20px 56px; color: #1f2937; }
  #empty-state svg { display: block; width: 150px; height: auto; margin: 0 auto 14px; }
  #empty-state p.empty-text { font-size: 28px; font-weight: 500; color: #1f2937; line-height: 1.25; }
  @media (max-width: 600px) {
    #empty-state { padding: 32px 16px 44px; }
    #empty-state svg { width: 120px; }
    #empty-state p.empty-text { font-size: 22px; }
  }
</style>
</head>
<body>

<div id="loading-state"><div class="icon">🏎️</div><p>Loading catalogue…</p></div>
<div id="error-state" class="hidden"><div class="icon">⚠️</div><h2>Couldn't load products</h2><p>Please refresh.</p></div>
<div id="availability-filter" class="avail-wrap hidden" role="group" aria-label="Filter by availability">
  <div class="avail-pill">
    <button type="button" class="avail-opt active" data-filter="all" aria-pressed="true"><span class="avail-label">All</span><span class="avail-count" id="count-all">0</span></button>
    <button type="button" class="avail-opt" data-filter="in-stock" aria-pressed="false"><span class="avail-label">In Stock</span><span class="avail-count" id="count-in-stock">0</span></button>
    <button type="button" class="avail-opt" data-filter="sold-out" aria-pressed="false"><span class="avail-label">Sold Out</span><span class="avail-count" id="count-sold-out">0</span></button>
  </div>
</div>
<div id="empty-state" class="hidden">
  <svg viewBox="0 0 160 140" fill="none" stroke="#1f2937" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true">
    <path d="M80 8v14M58 16l8 10M102 16l-8 10"/>
    <path d="M44 68L31 51l34-10 15 11z" fill="#f9fafb"/>
    <path d="M116 68l13-17-34-10-15 11z" fill="#f9fafb"/>
    <path d="M80 52l36 16-36 16-36-16z" fill="#e5e7eb"/>
    <path d="M44 68l36 16v44L44 112z" fill="#f3f4f6"/>
    <path d="M116 68L80 84v44l36-16z" fill="#d1d5db"/>
  </svg>
  <p class="empty-text">Nothing here right now</p>
</div>
<div id="grid" class="hidden"></div>
<div id="pagination" class="hidden"></div>
<div id="toast"></div>

<script>
  window.CATALOGUE_CONFIG = {
    seriesFilter: "Matchbox Box"
  };
</script>

<!-- Lightbox -->
<div id="lightbox" onclick="closeLightbox()" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.92);z-index:2000;align-items:center;justify-content:center;cursor:zoom-out;">
  <button onclick="closeLightbox()" style="position:fixed;top:16px;right:16px;background:rgba(255,255,255,0.15);border:none;color:#fff;font-size:24px;width:40px;height:40px;border-radius:50%;cursor:pointer;z-index:2001;display:flex;align-items:center;justify-content:center;">✕</button>
  <img id="lightbox-img" src="" style="max-width:92vw;max-height:92vh;object-fit:contain;border-radius:8px;box-shadow:0 8px 40px rgba(0,0,0,0.5);" onclick="event.stopPropagation()"/>
</div>
<script src="catalogue.js"></script>
</body>
</html>
